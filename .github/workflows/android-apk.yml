name: Build Football Stats APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer proyecto Android
        run: |
          unzip -o Football_Stats_Android_Nativo_con_Compilacion.zip -d androidsrc

      - name: Compilar APK
        run: |
          cd androidsrc/FootballStatsAndroid
          gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Stats-APK
          path: androidsrc/FootballStatsAndroid/app/build/outputs/apk/debug/app-debug.apk
